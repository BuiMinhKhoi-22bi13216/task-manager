services:
  api:
    build: .
    ports:
      - "127.0.0.1:8083:8000"
    env_file: .env
    environment:
      TASK_MANAGER_DB_PATH: /data/task_manager.db
      TASK_MANAGER_UPLOAD_DIR: /data/uploads
      TASK_MANAGER_REDIS_URL: redis://redis:6379/0
      TASK_MANAGER_SQL_ECHO: "true"
    volumes:
      - task-data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  task-data:
    external: true
    name: task-manager-day16-data