[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager"
version = "0.2.0"
description = "Python OOP Task Manager internship project"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["ruff>=0.17,<1", "mypy>=2.4,<3"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["task_manager*"]
exclude = ["tests*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["task_manager", "main.py"]
check_untyped_defs = true